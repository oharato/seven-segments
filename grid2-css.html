<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CSS Digit Grid (Tiled - GPU Optimized)</title>
<link rel="stylesheet" href="digit.css">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 90% 70% at 50% 50%, #15151a 0%, #06060a 80%);
    font-family: -apple-system, system-ui, sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    padding: 16px;
    box-sizing: border-box;
    display: grid;
    /* Automatically fill columns with minimum width of 44px, scaling up to equal fraction */
    grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
    /* Automatically size rows with minimum height of 78px, scaling up to equal fraction */
    grid-auto-rows: minmax(78px, 1fr);
    gap: 10px;
    align-content: center;
    justify-content: center;
    overflow: hidden;
  }
  .cell {
    justify-self: center;
    align-self: center;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
    box-sizing: border-box;
    aspect-ratio: 44 / 78; /* Maintain perfect digit aspect ratio */
    
    /* Performance optimization: Isolate layout, style, and paint to speed up initial rendering.
       Replaced content-visibility: auto to eliminate layout-blocking intersection checks. */
    contain: content;
  }
  
  .cell:hover {
    z-index: 10;
    /* Temporarily disable paint containment on hover to allow the neon drop-shadow glow to draw fully */
    contain: none;
  }

  .digit-container {
    width: 100%;
    height: 100%;
    position: relative;
    box-sizing: border-box;
  }

  .digit-container .digit {
    position: absolute;
    /* Safety margins: 5% vertical, 10% horizontal to accommodate the -6deg skew angle
       and prevent any edge clipping under contain: content. */
    top: 5%;
    left: 10%;
    width: 80%;
    height: 90%;
    margin: 0;
    opacity: 0;
    visibility: hidden;
    filter: none !important; /* CRITICAL: Disable expensive drop-shadow filters for baseline rendering */
    animation: show-digit var(--duration, 5s) infinite step-end;
    animation-delay: calc(var(--delay, 0s) + var(--duration, 5s) * 0.1 * var(--i));
  }

  .cell:hover .digit {
    /* Apply neon glow only when hovered */
    filter:
      drop-shadow(0 0 1px  var(--on))
      drop-shadow(0 0 4px  var(--glow-1))
      drop-shadow(0 0 10px var(--glow-2)) !important;
  }

  /* GPU accelerated step animation */
  @keyframes show-digit {
    0% { opacity: 1; visibility: visible; }
    10% { opacity: 0; visibility: hidden; }
    100% { opacity: 0; visibility: hidden; }
  }
</style>
</head>
