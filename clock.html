<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Digital Clock</title>
<link rel="stylesheet" href="digit.css">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse 80% 60% at 50% 30%, #1a1a20 0%, #0a0a0d 70%);
    display: grid;
    place-items: center;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
  }
  .display {
    display: inline-flex;
    align-items: center;
    padding: 28px 36px;
    background: linear-gradient(180deg, #18181d 0%, #08080b 100%);
    border-radius: 16px;
    box-shadow:
      inset 0 1px 0   rgba(255,255,255,.05),
      inset 0 0 0 1px rgba(255,255,255,.02),
      inset 0 -2px 10px rgba(0,0,0,.7),
      0 16px 40px -10px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
  <div class="display lg amber" id="clock">
    <div class="digit"></div><div class="digit"></div>
    <div class="colon blink"></div>
    <div class="digit"></div><div class="digit"></div>
    <div class="colon blink"></div>
    <div class="digit"></div><div class="digit"></div>
  </div>

<script>
  const digits = document.querySelectorAll('#clock .digit');
  const tick = () => {
    const n = new Date();
    const s = String(n.getHours()).padStart(2,'0')
            + String(n.getMinutes()).padStart(2,'0')
            + String(n.getSeconds()).padStart(2,'0');
    digits.forEach((d, i) => d.dataset.char = s[i]);
  };
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
