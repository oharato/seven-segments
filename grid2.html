<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Digit Grid (Tiled)</title>
<link rel="stylesheet" href="digit.css">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 90% 70% at 50% 50%, #15151a 0%, #06060a 80%);
    font-family: -apple-system, system-ui, sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    padding: 16px;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(var(--cols, 10), 1fr);
    grid-template-rows: repeat(var(--rows, 10), 1fr);
    gap: 0;
  }
  .cell {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 4px 6px;
    box-sizing: border-box;
    contain: layout style;
  }
  #stage .digit {
    width: 100%;
    height: 100%;
    margin: 0;
  }
</style>
</head>
<body>
  <div id="stage"></div>

<script>
  const themes = ['', 'amber', 'cyan', 'green', 'ice'];
  const stage = document.getElementById('stage');

  function build() {
    stage.innerHTML = '';
    const paddingX = 32; // 16px * 2
    const paddingY = 32; // 16px * 2
    const cols = Math.max(1, Math.round((window.innerWidth - paddingX) / 44));
    const rows = Math.max(1, Math.round((window.innerHeight - paddingY) / 78));
    stage.style.setProperty('--cols', cols);
    stage.style.setProperty('--rows', rows);
    const total = cols * rows;

    const digits = [];
    for (let i = 0; i < total; i++) {
      const sec = Math.random() * (10 - 0.1) + 0.1;
      const cell = document.createElement('div');
      cell.className = 'cell display ' + themes[i % themes.length];
      const d = document.createElement('div');
      d.className = 'digit';
      d.dataset.char = '0';
      cell.append(d);
      stage.append(cell);
      digits.push({ el: d, period: sec * 1000, next: sec * 1000, value: 0 });
    }
    return digits;
  }

  let digits = build();
  let start = performance.now();

  function loop(now) {
    const t = now - start;
    for (const d of digits) {
      if (t >= d.next) {
        const periodsPassed = Math.floor((t - d.next) / d.period) + 1;
        d.value = (d.value + periodsPassed) % 10;
        d.el.dataset.char = d.value;
        d.next += periodsPassed * d.period;
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      digits = build();
      start = performance.now();
    }, 150);
  });
</script>
</body>
</html>
